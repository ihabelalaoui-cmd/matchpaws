name: Publish MatchPaws V3

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract V3 package
        run: |
          rm -rf public
          mkdir public
          tar -xzf site-v3.tar.gz -C public

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload V3 site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Promote V3 sources to repository root
        run: |
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'public' --exclude 'site-v3.tar.gz' public/ ./
          rm -rf public
          rm -f site-v3.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish MatchPaws V3 sources [skip ci]"
            git push
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
